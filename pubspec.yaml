name: story_framework
description: >-
  Instagram-style stories for Flutter: a customizable viewer, a full editor,
  interactive stickers, video and audio, and export.
version: 0.1.1
repository: https://github.com/ChristianLloydSalon/story_framework
issue_tracker: https://github.com/ChristianLloydSalon/story_framework/issues
topics:
  - stories
  - story-viewer
  - editor
  - media
  - widget

screenshots:
  - description: The story viewer with segmented progress and a header.
    path: doc/screenshots/viewer.png
  - description: Interactive poll and link stickers.
    path: doc/screenshots/interactive.png
  - description: The story editor with layers, tools, and a timeline.
    path: doc/screenshots/editor.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  collection: ^1.18.0
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
