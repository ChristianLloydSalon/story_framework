# Tags a release when a new version reaches main.
#
# When pubspec.yaml's version has no `v<version>` tag yet, this runs the CI
# checks and pushes the tag, which starts the Publish workflow. The tag is
# pushed with the RELEASE_DEPLOY_KEY deploy key because tags pushed with the
# default GITHUB_TOKEN do not start other workflows.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Existing tags are needed.

      - id: check
        name: Find an untagged version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "\"' \r")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q "^## $version\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "Releasing $tag."
          echo "release=true" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  tag:
    name: Push tag
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require the deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::Add a write-enabled deploy key as the RELEASE_DEPLOY_KEY secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Tag and push
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
