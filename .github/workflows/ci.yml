name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release and Publish run these same checks before tagging or publishing.
  workflow_call:

concurrency:
  # Includes the calling workflow, so a release run never cancels plain CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The example is resolved too: the root analyzer also checks it.
      - name: Resolve dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Test example
        working-directory: example
        run: flutter test

      - name: Validate package
        run: flutter pub publish --dry-run
